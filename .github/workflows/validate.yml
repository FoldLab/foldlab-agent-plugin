name: Validate plugin manifests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.281

      - name: Validate Claude plugin and marketplace
        run: |
          claude plugin validate --strict plugins/foldlab
          claude plugin validate --strict .

      - name: Parse JSON manifests
        run: |
          python -m json.tool plugins/foldlab/plugin.json >/dev/null
          python -m json.tool plugins/foldlab/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/foldlab/.claude-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
